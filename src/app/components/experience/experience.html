<section class="exp-page">
  <div class="container">
    <header class="page-header">
      <p class="section-label">Career</p>
      <h1 class="section-title">Experience</h1>
      <div class="gold-line"></div>
      <p class="section-desc">Professional and industrial work experience.</p>
    </header>

    <!-- Work Experience -->
    <div class="timeline">
      @for (job of jobs; track job.company) {
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="job-header">
              <div class="job-meta">
                <h3 class="job-role">{{ job.role }}</h3>
                <div class="job-company">{{ job.company }}</div>
                <div class="job-sub">
                  <span class="job-period">{{ job.period }}</span>
                  <span class="job-sep">·</span>
                  <span class="job-location">{{ job.location }}</span>
                  <span class="job-sep">·</span>
                  <span class="job-type">{{ job.type }}</span>
                </div>
              </div>
            </div>
            <ul class="job-bullets">
              @for (b of job.bullets; track b) {
                <li>{{ b }}</li>
              }
            </ul>
            <div class="job-tech">
              @for (t of job.tech; track t) {
                <span class="tech-tag">{{ t }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
